<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Escolha de Clubes</title>
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="page-admin">
    <header class="topo">
      <h1>Painel Administrativo — Clubes</h1>
      <div class="topo-acoes">
        <button id="btn-exportar">Exportar Excel (.xlsx)</button>
        <button id="btn-sair" class="secundario">Sair</button>
      </div>
    </header>

    <p class="atualizado-em" id="atualizado-em"></p>

    <div class="painel-testes">
      <h2>Ferramentas de Teste</h2>
      <p class="sub">Use durante a fase de testes, antes de liberar para os alunos de verdade. Inscrições geradas aqui ficam marcadas como "teste" e podem ser removidas separadamente.</p>
      <div class="painel-testes-acoes">
        <div class="grupo-acao">
          <label for="qtd-seed">Gerar inscrições fictícias</label>
          <div class="linha-acao">
            <input type="number" id="qtd-seed" min="1" max="500" value="50" />
            <button id="btn-seed">Gerar</button>
          </div>
        </div>
        <div class="grupo-acao">
          <button id="btn-limpar-teste" class="perigo-leve">Limpar só as inscrições de teste</button>
        </div>
        <div class="grupo-acao">
          <button id="btn-limpar-tudo" class="perigo">Limpar TODAS as inscrições (inclusive manuais)</button>
        </div>
      </div>
      <p class="resultado-seed" id="resultado-seed"></p>
    </div>

    <div class="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th>Clube</th>
            <th>Presidente</th>
            <th>Padrinho</th>
            <th>Vagas</th>
            <th>Inscritos</th>
          </tr>
        </thead>
        <tbody id="tabela-clubes"></tbody>
      </table>
    </div>

    <div id="detalhe-clube" class="detalhe" hidden>
      <h2 id="detalhe-titulo"></h2>
      <table>
        <thead>
          <tr><th>#</th><th>Nome Completo</th><th>Turma</th><th>Data</th></tr>
        </thead>
        <tbody id="detalhe-tbody"></tbody>
      </table>
    </div>
  </div>
  <script src="/admin/admin.js"></script>
</body>
</html>
