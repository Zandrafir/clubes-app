app = "clubes-jem"
primary_region = "gru"

[build]

[env]
  PORT = "3000"
  DB_DIR = "/data"
  NODE_ENV = "production"

[[mounts]]
  source = "clubes_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/turmas"
